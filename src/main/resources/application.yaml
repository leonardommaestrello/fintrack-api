
spring:
  application:
    name: fintrack-api

  datasource:
    url: jdbc:postgresql://localhost:5432/fintrack
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080


jwt:
  secret: ${JWT_SECRET}
  expiration-ms: 3600000
